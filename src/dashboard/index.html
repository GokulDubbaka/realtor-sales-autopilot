<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Screen Pop — Realtor Autopilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #e8b86d;
      --gold-light: #f5d08a;
      --dark: #0d0d1a;
      --card: #12121f;
      --border: #1e1e3a;
      --text: #e8e8f0;
      --muted: #6b7280;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── INCOMING CALL ALERT ── */
    .incoming-alert {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }
    .incoming-alert.show { display: flex; }
    .pulse-ring {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(232,184,109,0.15);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      margin-bottom: 24px;
    }
    .pulse-ring::before, .pulse-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--gold);
      animation: pulse 1.5s ease-out infinite;
    }
    .pulse-ring::before { width: 100%; height: 100%; animation-delay: 0s; }
    .pulse-ring::after { width: 140%; height: 140%; animation-delay: 0.5s; }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .phone-icon { font-size: 48px; animation: ring 0.5s ease infinite alternate; }
    @keyframes ring { from { transform: rotate(-15deg); } to { transform: rotate(15deg); } }
    .incoming-name { font-size: 32px; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
    .incoming-phone { font-size: 18px; color: var(--muted); margin-bottom: 32px; }
    .dismiss-btn {
      background: var(--gold); color: var(--dark);
      border: none; padding: 14px 40px;
      border-radius: 50px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: transform 0.2s;
    }
    .dismiss-btn:hover { transform: scale(1.05); }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #0d0d1a 0%, #12121f 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 28px; }
    .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); }
    .logo-sub { font-size: 12px; color: var(--muted); }
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 20px; padding: 6px 16px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: blink 1.5s ease infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .status-text { font-size: 13px; font-weight: 600; color: var(--success); }

    /* ── MAIN CONTENT ── */
    .content {
      flex: 1;
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: border-color 0.3s;
    }
    .card:hover { border-color: rgba(232,184,109,0.3); }
    .card-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── CLIENT PROFILE ── */
    .client-profile { grid-column: 1 / -1; }
    .profile-header {
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 24px;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold) 0%, #c9952e 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: var(--dark);
      flex-shrink: 0;
    }
    .client-name { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.2; }
    .client-phone { font-size: 16px; color: var(--muted); margin-top: 4px; }
    .call-badge {
      margin-left: auto;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.4);
      color: var(--success);
      border-radius: 20px; padding: 8px 20px;
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .call-timer { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .fields-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .field-item { }
    .field-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .field-value { font-size: 15px; font-weight: 500; color: var(--text); }
    .field-value.highlight { color: var(--gold); font-weight: 700; }

    /* ── NOTES ── */
    .notes-box {
      background: rgba(232,184,109,0.05);
      border: 1px solid rgba(232,184,109,0.15);
      border-radius: 10px; padding: 14px;
      margin-top: 16px;
      font-size: 14px; color: var(--text); line-height: 1.6;
    }

    /* ── CALL HISTORY ── */
    .history-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .history-item:last-child { border-bottom: none; }
    .history-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .history-dot.contacted { background: var(--success); }
    .history-dot.missed { background: var(--danger); }
    .history-dot.voicemail { background: var(--warning); }
    .history-text { font-size: 13px; color: var(--muted); }
    .history-date { margin-left: auto; font-size: 12px; color: var(--muted); }

    /* ── QUICK ACTIONS ── */
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .action-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 14px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 10px;
      font-family: 'Inter', sans-serif;
    }
    .action-btn:hover {
      background: rgba(232,184,109,0.1);
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-1px);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 60px;
      text-align: center;
    }
    .empty-icon { font-size: 64px; opacity: 0.3; }
    .empty-title { font-size: 20px; font-weight: 600; color: var(--muted); }
    .empty-sub { font-size: 14px; color: var(--muted); opacity: 0.6; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .content { animation: slideUp 0.4s ease; }
  </style>
</head>
<body>

<!-- Incoming Call Alert Overlay -->
<div class="incoming-alert" id="incomingAlert">
  <div class="pulse-ring">
    <span class="phone-icon">📞</span>
  </div>
  <div class="incoming-name" id="alertName">—</div>
  <div class="incoming-phone" id="alertPhone">—</div>
  <button class="dismiss-btn" onclick="dismissAlert()">View Client Details</button>
</div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <span class="logo-icon">🏠</span>
    <div>
      <div class="logo-text">Realtor Autopilot</div>
      <div class="logo-sub">Agent Screen Pop</div>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    <span class="status-text" id="statusText">Waiting for call...</span>
  </div>
</div>

<!-- Empty State (shown before a call) -->
<div class="empty-state" id="emptyState">
  <div class="empty-icon">📱</div>
  <div class="empty-title">No active call</div>
  <div class="empty-sub">Client data will appear here automatically when a call connects</div>
</div>

<!-- Client Data (shown on call) -->
<div class="content" id="mainContent" style="display:none">

  <!-- Client Profile Card -->
  <div class="card client-profile">
    <div class="card-title">📋 Client Profile</div>
    <div class="profile-header">
      <div class="avatar" id="avatarInitials">—</div>
      <div>
        <div class="client-name" id="clientName">—</div>
        <div class="client-phone" id="clientPhone">—</div>
      </div>
      <div class="call-badge">
        <span>🔴 LIVE</span>
        <span class="call-timer" id="callTimer">00:00</span>
      </div>
    </div>
    <div class="fields-grid">
      <div class="field-item">
        <div class="field-label">Property Interest</div>
        <div class="field-value highlight" id="clientProperty">—</div>
      </div>
      <div class="field-item">
        <div class="field-label">Budget</div>
        <div class="field-value highlight" id="clientBudget">—</div>
      </div>
      <div class="field-item">
        <div class="field-label">Call Attempts</div>
        <div class="field-value" id="clientAttempts">—</div>
      </div>
    </div>
    <div class="notes-box" id="clientNotes">No notes available.</div>
  </div>

  <!-- Call History -->
  <div class="card">
    <div class="card-title">📅 History</div>
    <div id="callHistory">
      <div class="history-item">
        <div class="history-dot voicemail"></div>
        <div class="history-text">No prior contact</div>
      </div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="card">
    <div class="card-title">⚡ Quick Actions</div>
    <div class="actions-grid">
      <button class="action-btn" onclick="markInterested()">✅ Mark Interested</button>
      <button class="action-btn" onclick="scheduleFollowup()">📅 Schedule Follow-up</button>
      <button class="action-btn" onclick="openWhatsApp()">💬 WhatsApp</button>
      <button class="action-btn" onclick="copyPhone()">📋 Copy Phone</button>
    </div>
  </div>
</div>

<script>
  let ws;
  let callStartTime;
  let timerInterval;
  let currentClient = null;

  // Get row index from URL if navigated directly
  const pathParts = window.location.pathname.split('/');
  const rowIndex = pathParts[pathParts.length - 1];

  if (rowIndex && !isNaN(rowIndex)) {
    // Direct navigation — fetch client data
    fetch(`/client/${rowIndex}`)
      .then(r => r.json())
      .then(data => showClientData(data))
      .catch(() => {});
  }

  // Connect WebSocket for live events
  function connectWS() {
    ws = new WebSocket(`ws://${location.host}`);
    ws.onmessage = (e) => {
      const event = JSON.parse(e.data);
      handleEvent(event);
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  }
  connectWS();

  function handleEvent(event) {
    console.log('[WS]', event);
    switch (event.type) {
      case 'CALL_START':
        document.getElementById('statusText').textContent = `Dialing ${event.clientName}...`;
        break;
      case 'HUMAN_DETECTED':
        document.getElementById('statusText').textContent = `🔴 LIVE — ${event.clientName}`;
        showIncomingAlert(event.clientName, '');
        // Fetch full client data
        fetch(`/client/${event.clientRowIndex || ''}`)
          .then(r => r.json()).then(showClientData).catch(() => {});
        break;
      case 'AGENT_CONNECTED':
        document.getElementById('statusText').textContent = `✅ ${event.agentName} connected`;
        startTimer();
        break;
      case 'ALL_MISSED':
      case 'NO_ANSWER':
      case 'VOICEMAIL':
        document.getElementById('statusText').textContent = 'Waiting for call...';
        hideClientData();
        break;
    }
  }

  function showIncomingAlert(name, phone) {
    document.getElementById('alertName').textContent = name;
    document.getElementById('alertPhone').textContent = phone || 'Incoming Call';
    document.getElementById('incomingAlert').classList.add('show');
  }

  function dismissAlert() {
    document.getElementById('incomingAlert').classList.remove('show');
  }

  function showClientData(client) {
    currentClient = client;
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('mainContent').style.display = 'grid';
    document.getElementById('clientName').textContent = client.name || '—';
    document.getElementById('clientPhone').textContent = client.phone || '—';
    document.getElementById('clientProperty').textContent = client.property || '—';
    document.getElementById('clientBudget').textContent = client.budget || '—';
    document.getElementById('clientAttempts').textContent = (client.attempts || 0) + 1;
    document.getElementById('clientNotes').textContent = client.notes || 'No notes available.';
    const initials = (client.name || 'C').split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('avatarInitials').textContent = initials;
    callStartTime = Date.now();
    startTimer();
  }

  function hideClientData() {
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'none';
    clearInterval(timerInterval);
    currentClient = null;
  }

  function startTimer() {
    clearInterval(timerInterval);
    callStartTime = Date.now();
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      const el = document.getElementById('callTimer');
      if (el) el.textContent = `${m}:${s}`;
    }, 1000);
  }

  function openWhatsApp() {
    if (!currentClient) return;
    const phone = (currentClient.whatsapp || currentClient.phone || '').replace(/^\+/, '');
    window.open(`https://wa.me/${phone}`, '_blank');
  }

  function copyPhone() {
    if (!currentClient) return;
    navigator.clipboard.writeText(currentClient.phone || '');
    alert('Phone number copied!');
  }

  function markInterested() {
    alert('Feature: Mark as Interested — update sheet manually for now.');
  }

  function scheduleFollowup() {
    alert('Feature: Schedule Follow-up — coming soon.');
  }
</script>
</body>
</html>
