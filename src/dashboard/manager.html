<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager View — Realtor Autopilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #e8b86d;
      --dark: #0a0a14;
      --card: #111120;
      --card2: #16162a;
      --border: #1e1e3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #0a0a14 0%, #111120 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex; align-items: center; gap: 20px;
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--gold); }
    .logo span { color: var(--text); font-weight: 300; }
    .header-sub { font-size: 13px; color: var(--muted); margin-left: auto; }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 20px; padding: 5px 14px;
      font-size: 12px; font-weight: 700; color: var(--danger);
    }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); animation: blink 1s ease infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

    /* ── STATS ROW ── */
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 24px 32px 0; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px;
      position: relative; overflow: hidden;
      transition: border-color 0.3s;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; border-radius: 14px 14px 0 0;
    }
    .stat-card.total::before { background: var(--info); }
    .stat-card.connected::before { background: var(--success); }
    .stat-card.missed::before { background: var(--danger); }
    .stat-card.voicemail::before { background: var(--warning); }
    .stat-card.hunting::before { background: var(--gold); }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 36px; font-weight: 800; margin-top: 6px; }
    .stat-card.total .stat-value { color: var(--info); }
    .stat-card.connected .stat-value { color: var(--success); }
    .stat-card.missed .stat-value { color: var(--danger); }
    .stat-card.voicemail .stat-value { color: var(--warning); }
    .stat-card.hunting .stat-value { color: var(--gold); }

    /* ── MAIN AREA ── */
    .main { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 24px 32px; }

    /* ── CALL TABLE ── */
    .section-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .table-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--card2); }
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 16px;
      font-size: 13px; color: var(--text);
      border-bottom: 1px solid rgba(30,30,58,0.5);
    }
    tr:last-child td { border-bottom: none; }
    tr { transition: background 0.2s; }
    tr:hover td { background: rgba(232,184,109,0.03); }

    /* Row status colors */
    tr.status-connected td:first-child { border-left: 3px solid var(--success); }
    tr.status-hunting td:first-child { border-left: 3px solid var(--gold); }
    tr.status-missed td:first-child { border-left: 3px solid var(--danger); }
    tr.status-voicemail td:first-child { border-left: 3px solid var(--warning); }
    tr.status-dialing td:first-child { border-left: 3px solid var(--info); }

    /* Status badges */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge.connected { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .badge.hunting { background: rgba(232,184,109,0.15); color: var(--gold); border: 1px solid rgba(232,184,109,0.3); }
    .badge.missed { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    .badge.voicemail { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
    .badge.dialing { background: rgba(59,130,246,0.15); color: var(--info); border: 1px solid rgba(59,130,246,0.3); }
    .badge.pending { background: rgba(100,116,139,0.15); color: var(--muted); border: 1px solid rgba(100,116,139,0.3); }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.connected .badge-dot { animation: blink 1.2s ease infinite; }

    /* ── EVENT LOG ── */
    .event-log {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .event-log-header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--card2); }
    .event-list { max-height: 600px; overflow-y: auto; }
    .event-list::-webkit-scrollbar { width: 4px; }
    .event-list::-webkit-scrollbar-track { background: var(--card); }
    .event-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .event-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(30,30,58,0.4);
      display: flex; gap: 10px;
      animation: fadeSlide 0.3s ease;
    }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .event-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .event-body { }
    .event-text { font-size: 13px; color: var(--text); line-height: 1.4; }
    .event-time { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .empty-table { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">Realtor <span>Autopilot</span> — Manager View</div>
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  <div class="header-sub" id="currentTime">—</div>
</div>

<!-- Stats Row -->
<div class="stats">
  <div class="stat-card total">
    <div class="stat-label">Total Dialed</div>
    <div class="stat-value" id="statTotal">0</div>
  </div>
  <div class="stat-card connected">
    <div class="stat-label">Connected</div>
    <div class="stat-value" id="statConnected">0</div>
  </div>
  <div class="stat-card missed">
    <div class="stat-label">All Missed</div>
    <div class="stat-value" id="statMissed">0</div>
  </div>
  <div class="stat-card voicemail">
    <div class="stat-label">Voicemail</div>
    <div class="stat-value" id="statVoicemail">0</div>
  </div>
  <div class="stat-card hunting">
    <div class="stat-label">Hunting</div>
    <div class="stat-value" id="statHunting">0</div>
  </div>
</div>

<!-- Main Content -->
<div class="main">
  <!-- Call Table -->
  <div>
    <div class="section-title">📊 Call Queue</div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Client</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Agent</th>
            <th>Duration</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="callTable">
          <tr><td colspan="6" class="empty-table">Waiting for calls to begin...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Event Log -->
  <div>
    <div class="section-title">⚡ Live Events</div>
    <div class="event-log">
      <div class="event-log-header">
        <div style="font-size:12px;color:var(--muted);">Real-time activity log</div>
      </div>
      <div class="event-list" id="eventList">
        <div class="event-item">
          <div class="event-icon">🟢</div>
          <div class="event-body">
            <div class="event-text">System started — waiting for calls</div>
            <div class="event-time" id="startTime">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const stats = { total: 0, connected: 0, missed: 0, voicemail: 0, hunting: 0 };
  const callRows = {};

  // Clock
  setInterval(() => {
    document.getElementById('currentTime').textContent = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
  }, 1000);
  document.getElementById('startTime').textContent = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata' });

  // WebSocket
  let ws;
  function connect() {
    ws = new WebSocket(`ws://${location.host}`);
    ws.onmessage = (e) => {
      const event = JSON.parse(e.data);
      handleEvent(event);
    };
    ws.onclose = () => setTimeout(connect, 3000);
  }
  connect();

  function handleEvent(event) {
    const now = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata' });
    addEvent(event, now);
    updateTable(event, now);
    updateStats(event);
  }

  const eventConfig = {
    CALL_START:      { icon: '📞', text: e => `Dialing ${e.clientName} (${e.clientPhone})` },
    HUMAN_DETECTED:  { icon: '👤', text: e => `Human answered — ${e.clientName}` },
    HUNT_ATTEMPT:    { icon: '🔔', text: e => `Ringing Agent ${e.agentIndex}: ${e.agentName}` },
    AGENT_CONNECTED: { icon: '✅', text: e => `${e.agentName} connected with ${e.clientName}` },
    NO_ANSWER:       { icon: '📵', text: e => `No answer from ${e.clientName}` },
    VOICEMAIL:       { icon: '🔊', text: e => `Voicemail detected — ${e.clientName}` },
    ALL_MISSED:      { icon: '🔴', text: e => `All agents missed — ${e.clientName}` },
    INIT:            { icon: '🟢', text: () => 'Connected to autopilot system' },
  };

  function addEvent(event, now) {
    const cfg = eventConfig[event.type] || { icon: '⚪', text: () => event.type };
    const list = document.getElementById('eventList');
    const item = document.createElement('div');
    item.className = 'event-item';
    item.innerHTML = `
      <div class="event-icon">${cfg.icon}</div>
      <div class="event-body">
        <div class="event-text">${cfg.text(event)}</div>
        <div class="event-time">${now}</div>
      </div>`;
    list.insertBefore(item, list.firstChild);
    // Keep only last 50 events
    while (list.children.length > 50) list.removeChild(list.lastChild);
  }

  function updateTable(event, now) {
    const table = document.getElementById('callTable');
    if (!event.callId) return;

    if (event.type === 'CALL_START') {
      // Remove empty state row
      const empty = table.querySelector('.empty-table');
      if (empty) empty.parentElement.remove();

      callRows[event.callId] = {
        name: event.clientName,
        phone: event.clientPhone,
        status: 'dialing',
        agent: '—',
        startTime: now,
        callId: event.callId,
      };
    }

    if (!callRows[event.callId]) return;
    const row = callRows[event.callId];

    if (event.type === 'HUMAN_DETECTED') row.status = 'hunting';
    if (event.type === 'HUNT_ATTEMPT') { row.status = 'hunting'; row.agent = event.agentName; }
    if (event.type === 'AGENT_CONNECTED') { row.status = 'connected'; row.agent = event.agentName; }
    if (event.type === 'NO_ANSWER') row.status = 'missed';
    if (event.type === 'VOICEMAIL') row.status = 'voicemail';
    if (event.type === 'ALL_MISSED') { row.status = 'missed'; }

    callRows[event.callId] = row;
    renderTable();
  }

  function renderTable() {
    const table = document.getElementById('callTable');
    table.innerHTML = Object.values(callRows).reverse().map(row => `
      <tr class="status-${row.status}">
        <td><strong>${row.name}</strong></td>
        <td style="color:var(--muted);font-family:monospace">${row.phone || '—'}</td>
        <td><span class="badge ${row.status}"><span class="badge-dot"></span>${row.status.toUpperCase()}</span></td>
        <td>${row.agent}</td>
        <td>—</td>
        <td style="color:var(--muted)">${row.startTime}</td>
      </tr>`).join('');
  }

  function updateStats(event) {
    if (event.type === 'CALL_START') stats.total++;
    if (event.type === 'AGENT_CONNECTED') { stats.connected++; stats.hunting = Math.max(0, stats.hunting - 1); }
    if (event.type === 'HUNT_ATTEMPT') stats.hunting++;
    if (event.type === 'ALL_MISSED') { stats.missed++; stats.hunting = Math.max(0, stats.hunting - 1); }
    if (event.type === 'VOICEMAIL') stats.voicemail++;
    if (event.type === 'NO_ANSWER') stats.missed++;

    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statConnected').textContent = stats.connected;
    document.getElementById('statMissed').textContent = stats.missed;
    document.getElementById('statVoicemail').textContent = stats.voicemail;
    document.getElementById('statHunting').textContent = stats.hunting;
  }
</script>
</body>
</html>
